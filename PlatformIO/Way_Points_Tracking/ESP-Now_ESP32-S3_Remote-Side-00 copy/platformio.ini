; ESP32-S3 DevKitC-1 Remote-Side
[env:esp32-s3-devkitc1-n16r8]
platform = espressif32
board = esp32-s3-devkitc1-n16r8
framework = arduino
monitor_speed = 115200
upload_port = COM16
monitor_port = COM16
