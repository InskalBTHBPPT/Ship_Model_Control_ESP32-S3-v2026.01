[env:esp32-s3-devkitc1-n16r8]
platform = espressif32
board = esp32-s3-devkitc1-n16r8
framework = arduino
monitor_speed = 115200
upload_port = COM16
monitor_port = COM16
lib_deps = 
    https://github.com/madhephaestus/ESP32Servo
    https://github.com/mikalhart/TinyGPSPlus
    ; \library\JY901